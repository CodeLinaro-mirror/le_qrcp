# Bluetooth disabled by default
CONFIG_BT=n

# WiFi co-processor configuration

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_SOCKETS_PACKET=y

CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_BUF_LOG=y

# Network thread stacks
CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_NET_RX_STACK_SIZE=1024

# Kernel options
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y


# Compiler optimizations
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=n

# Compiler warning configuration
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# Thread info & monitoring
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_INIT_STACKS=y

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=30720
CONFIG_SHARED_MULTI_HEAP=y

# Network buffers
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=1514

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NET_BUF_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_PRINTK=y

CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=n
CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=n
CONFIG_NET_CORE_LOG_LEVEL_DBG=n
CONFIG_NET_CONN_LOG_LEVEL_DBG=n
CONFIG_NET_IF_LOG_LEVEL_DBG=n
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_NET_PKT_LOG_LEVEL_ERR=n

CONFIG_QUALCOMM_RCP_BUS_LOG_LEVEL_DBG=n
CONFIG_QUALCOMM_RCP_PROTOCOL_LOG_LEVEL_DBG=n

# Shell
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_OPAL_WIFI_SHELL=n
CONFIG_NET_BUF_POOL_USAGE=y

# RCP protocol
CONFIG_QUALCOMM_RCP_PROTOCOL_NUM_BUFFERS=27
CONFIG_QUALCOMM_RCP_RCP_MAX_TX_EVENTS=24
# Suppress sequence number checks
CONFIG_QUALCOMM_RCP_SEQ_NUM_ACK_WINDOW=7
CONFIG_QUALCOMM_RCP_PROTOCOL_BUFFER_SIZE=1600
CONFIG_QUALCOMM_RCP_BUS_DRIVERS=y
# Optional single-channel VSerial log backend
CONFIG_QUALCOMM_RCP_APP_VSERIAL_LOG=y
CONFIG_QUALCOMM_RCP_APP_VSERIAL_LOG_PORT=0
CONFIG_QUALCOMM_RCP_APP_VSERIAL_LOG_LINE_MAX=256
CONFIG_QUALCOMM_RCP_APP_VSERIAL_LOG_DROP_WHEN_BUSY=y
CONFIG_QUALCOMM_RCP_APP_VSERIAL_LOG_DUPLICATE_TO_PHYS_UART=n
# Use dummy data for testing
CONFIG_USE_DUMMY_WIFI_MGMT_DATA=n
# Build transport test code
CONFIG_INCLUDE_TRANSPORT_TESTS=y

# Initalization order
CONFIG_QUALCOMM_RCP_INIT_PRIORITY=80
# Needs to be higher priority than NET_INIT_PRIO (90)
CONFIG_IEEE802154_OPAL_INIT_PRIO=89
CONFIG_QUALCOMM_RCP_VSERIAL_INIT_PRIORITY=85

# Keep deferred logging but trim RAM usage for qcc743 WiFi profile.
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=1000
# WiFi & L2 drivers
CONFIG_WIFI=y
CONFIG_WIFI_OPAL=y
CONFIG_OPAL_WIFI_AP_STA_MODE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_PHY_DRIVER=y

# Management
CONFIG_WIFI_NM=y
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2560

# mbedTLS
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_DTLS=y
CONFIG_MBEDTLS_SSL_ALPN=y
CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_CIPHER_DES_ENABLED=y
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_GENPRIME_ENABLED=y
CONFIG_MBEDTLS_DHM_C=y
CONFIG_MBEDTLS_HMAC_DRBG_ENABLED=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_MD5=y
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_CMAC=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y

# RCP encryption and prerequisites.
# The PSA API algorithms will be automatically selected.
# By default only WiFi management messages are encrypted.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_QUALCOMM_RCP_ENCRYPTION=y

# Use hardware entropy
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_ENTROPY_GENERATOR=y

# mbedTLS heap
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096

# Nanopb
CONFIG_NANOPB=y
